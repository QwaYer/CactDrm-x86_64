# cactsync manifest — see ../.cactsync/README.md
#
# The upstream tree is this repository itself: libdrm's sources sit at the root
# and the Cact additions are commits on the `cact` branch, stacked on the pinned
# upstream tag.  Note that this port removed upstream's meson.build and
# meson_options.txt (it owns its build) — a sync onto a newer tag conflicts on
# those two paths; keep CactOS's files.

CACT_SYNC_NAME="CactDrm-x86_64"
CACT_SYNC_TREE="."

# `upstream` is gitlab.freedesktop.org/mesa/drm; `origin` is reserved for the
# published CactOS repo (QwaYer/CactDrm-x86_64) so a push cannot reach upstream.
CACT_SYNC_REMOTE="upstream"
CACT_SYNC_URL="https://gitlab.freedesktop.org/mesa/drm.git"

CACT_SYNC_TAG_GLOB="libdrm-2.4.*"
CACT_SYNC_TAG_EXCLUDE="-rc"

CACT_SYNC_REF="libdrm-2.4.134"

CACT_SYNC_MODE="rebase"

CACT_SYNC_UNSHALLOW=1

CACT_SYNC_VERIFY="ninja -C build-meson"

CACT_SYNC_NOTES="libdrm core only; the Cact build replaces upstream's meson.build/meson_options.txt"
